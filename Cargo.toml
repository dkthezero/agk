[package]
name = "agk"
version = "0.3.2"
edition = "2021"
authors = ["dkthezero"]
description = "The agent kit for teams to share the way they work with AI agents together"
repository = "https://github.com/dkthezero/agk"
license = "MIT"
keywords = ["cli", "vault", "tui", "mcp", "skills"]
categories = ["command-line-utilities"]
readme = "README.md"

[lib]
name = "agk"
path = "src/lib.rs"

[[bin]]
name = "agk"
path = "src/main.rs"

[[test]]
name = "full_flow_tui"
path = "tests/full_flow_tui/mod.rs"

[[test]]
name = "integration_team_sync"
path = "tests/integration/team_sync.rs"

[features]
default = ["tui", "vault-clawhub", "pack", "provider-opencode", "provider-claude", "provider-github", "provider-gemini", "provider-amp", "provider-firebender", "provider-letta", "provider-snowflake"]
headless = []
tui = ["dep:ratatui", "dep:crossterm"]
pack = ["dep:zip", "dep:tar", "dep:flate2"]
vault-clawhub = ["dep:reqwest"]
yaml = []
provider-opencode = []
provider-claude = []
provider-github = []
provider-gemini = []
provider-amp = []
provider-firebender = []
provider-letta = []
provider-snowflake = []
observability = ["dep:tracing", "dep:tracing-subscriber"]

[dependencies]
ratatui = { version = "0.30", optional = true }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", optional = true, features = ["env-filter", "fmt", "json"] }
crossterm = { version = "0.28", features = ["event-stream"], optional = true }
clap = { version = "4", features = ["derive"] }
sha2 = "0.10"
hex = "0.4"
walkdir = "2"
rayon = "1.10"
anyhow = "1"
toml = "0.8"
serde = { version = "1", features = ["derive"] }
dirs-next = "2"
tokio = { version = "1.35", features = ["full"] }
async-trait = "0.1"
futures = "0.3"
serde_json = "1"
zip = { version = "2.2", optional = true }
tar = { version = "0.4", optional = true }
flate2 = { version = "1", optional = true }
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }
thiserror = "1"
url = { version = "2", features = ["serde"] }
semver = "1"

[dev-dependencies]
tempfile = "3"
insta = "1"
assert_cmd = "2"
predicates = "3"

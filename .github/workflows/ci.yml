name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt-lint-test:
    name: Check, Format & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Check
        run: cargo check

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --workspace --all-targets --all-features --verbose

  architecture:
    name: Architecture Boundary Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --test architecture -- --ignored

  feature-matrix:
    name: Feature Matrix
    runs-on: ubuntu-latest
    continue-on-error: true # Phase E — feature slimming incomplete; --no-default-features combinations need cfg-gating
    strategy:
      fail-fast: false
      matrix:
        features:
          - "--all-features"
          # Phase E: Add back --no-default-features combinations once cfg-gating is complete
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check ${{ matrix.features }}

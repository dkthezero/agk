name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always
  # Opt into Node.js 24 early to silence deprecation warnings on actions that
  # still run on Node.js 20 (e.g. third-party actions not yet updated).
  # Node.js 24 becomes the default on 2026-06-02; this env var can be removed
  # once every action in the workflow is natively on Node.js 24.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  fmt-lint-test:
    name: Check & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Check
        run: cargo check

      - name: Format
        run: cargo fmt --check

      - name: Clippy (full)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      # Two test runs cover the whole feature surface: the default feature set
      # (what users get out of the box) and the full set (`--all-features`).
      # The slim build is exercised by `tests/slim_build_smoke.rs`, which is
      # part of the default run, so no separate matrix job is needed.
      - name: Run tests (default features)
        run: cargo test --workspace --verbose

      - name: Run tests (full / all features)
        run: cargo test --workspace --all-targets --all-features --verbose

  architecture:
    name: Architecture Boundary Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --test architecture -- --ignored

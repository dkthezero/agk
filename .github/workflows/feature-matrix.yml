name: Feature Matrix

on:
  push:
    branches: [master, feat/**]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Opt into Node.js 24 early to silence deprecation warnings on actions that
  # still run on Node.js 20 (e.g. third-party actions not yet updated).
  # Node.js 24 becomes the default on 2026-06-02; this env var can be removed
  # once every action in the workflow is natively on Node.js 24.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test-matrix:
    name: cargo test (${{ matrix.features }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features:
          - ""                       # no features at all (true minimal)
          - "tui"                    # slim
          - "tui,pack"
          - "tui,profile-create"
          - "tui,claude-cli-probe"
          - "tui,llm-ollama"
          - "tui,llm-lmstudio"
          - "tui,llm-anthropic"
          - "tui,llm-openai"
          - "tui,llm-ollama,llm-lmstudio,llm-anthropic,llm-openai,profile-create,claude-cli-probe,pack"  # all
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ matrix.features }}-${{ hashFiles('Cargo.lock') }}
      - name: Run tests
        env:
          RUSTFLAGS: -D warnings
        run: |
          if [ -z "${{ matrix.features }}" ]; then
            cargo test --no-default-features
          else
            cargo test --no-default-features --features "${{ matrix.features }}"
          fi

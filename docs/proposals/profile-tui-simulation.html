<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>agk TUI - Simulation Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        /* ==========================================================
           TUI CSS FRAMEWORK - PURE VANILLA CSS
           ========================================================== */
        :root {
            --bg-color: #0c0c0c;
            --fg-color: #d1d5db;
            --fg-muted: #6b7280;
            --border-color: #555555;
            --highlight-bg: #d1d5db;
            --highlight-fg: #0c0c0c;
            --accent-green: #4ade80;
            --accent-blue: #60a5fa;
            --accent-yellow: #fbbf24;
            --accent-purple: #c084fc;
            --font-mono: 'Fira Code', 'Courier New', Courier, monospace;
        }

        * { box-sizing: border-box; }

        body {
            background-color: var(--bg-color);
            color: var(--fg-color);
            font-family: var(--font-mono);
            font-size: 13px;
            margin: 0;
            padding: 8px;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            user-select: none;
        }

        .tui-app {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            max-width: 1600px;
        }

        /* Top Bar Info Row */
        .tui-topbar {
            color: var(--fg-muted);
            font-size: 12px;
            margin-bottom: 2px;
            white-space: nowrap;
        }

        /* Header Navigation Tabs */
        .tui-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            color: var(--fg-muted);
            white-space: nowrap;
            overflow-x: auto;
            border-bottom: 1px dashed var(--border-color);
            padding-bottom: 6px;
        }
        .tui-header::-webkit-scrollbar { display: none; }

        .tui-tab-group { display: flex; gap: 16px; }
        .tui-tab {
            cursor: pointer;
            padding: 2px 6px;
        }
        .tui-tab.active {
            color: var(--highlight-fg);
            background-color: var(--highlight-bg);
            font-weight: bold;
        }

        /* Split Window Layout */
        .tui-main {
            flex: 1;
            display: flex;
            gap: 8px;
            min-height: 0;
        }
        @media (max-width: 768px) {
            .tui-main { flex-direction: column; }
        }

        /* Ratatui Standard Panel Rendering */
        .tui-panel {
            flex: 1;
            border: 1px solid var(--border-color);
            position: relative;
            display: flex;
            flex-direction: column;
            padding: 14px 8px 8px 8px;
            margin-top: 8px;
        }
        .tui-panel.left-pane { flex: 1.3; }
        .tui-panel.right-pane { flex: 0.7; }

        .tui-panel-title {
            position: absolute;
            top: -10px;
            left: 12px;
            background-color: var(--bg-color);
            padding: 0 4px;
            color: var(--fg-color);
        }
        .tui-panel-title::before { content: '┌'; margin-right: 2px; color: var(--border-color); }
        .tui-panel-title::after { content: '─'; margin-left: 2px; color: var(--border-color); display: inline-block; width: 30px; letter-spacing: -1px;}

        .tui-panel::before, .tui-panel::after {
            content: ''; position: absolute; width: 4px; height: 4px;
        }
        .tui-panel::before { top: -1px; right: -1px; border-top: 1px solid var(--border-color); border-right: 1px solid var(--border-color); }
        .tui-panel::after { bottom: -1px; left: -1px; border-bottom: 1px solid var(--border-color); border-left: 1px solid var(--border-color); }

        /* Monospace Lists */
        .tui-list {
            flex: 1;
            overflow-y: auto;
            scrollbar-width: none;
            display: flex;
            flex-direction: column;
        }
        .tui-list::-webkit-scrollbar { display: none; }

        .tui-list-item {
            display: flex;
            justify-content: space-between;
            padding: 2px 4px;
            white-space: nowrap;
        }
        .tui-list-item .primary { display: flex; gap: 8px; }
        .tui-list-item .secondary { color: var(--fg-muted); }

        .tui-list-item.selected {
            background-color: var(--highlight-bg);
            color: var(--highlight-fg);
        }
        .tui-list-item.selected .secondary {
            color: var(--highlight-fg);
            opacity: 0.8;
        }

        /* Detail/Inspection Layout Elements */
        .profile-title {
            font-size: 16px;
            font-weight: bold;
            color: var(--accent-blue);
            margin-bottom: 12px;
            border-bottom: 1px dashed var(--border-color);
            padding-bottom: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .detail-row {
            display: flex;
            margin-bottom: 5px;
            line-height: 1.4;
        }
        .detail-label {
            width: 100px;
            flex-shrink: 0;
            color: var(--fg-muted);
            font-weight: bold;
        }
        .detail-value {
            flex: 1;
            word-break: break-all;
            white-space: pre-wrap;
        }
        .overview-box {
            border-top: 1px dashed var(--border-color);
            margin-top: 10px;
            padding-top: 10px;
        }
        .overview-title {
            color: var(--accent-yellow);
            font-weight: bold;
            margin-bottom: 6px;
        }

        /* Integrated Search Console Row */
        .search-row {
            border-top: 1px dashed var(--border-color);
            margin-top: auto;
            padding-top: 6px;
            color: var(--fg-color);
            display: flex;
            align-items: center;
        }
        .search-label {
            color: var(--accent-yellow);
            font-weight: bold;
            margin-right: 8px;
        }

        /* Bottom Status bar */
        .tui-footer {
            margin-top: 8px;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            color: var(--fg-muted);
            border-top: 1px solid var(--border-color);
            padding-top: 6px;
        }
        .hotkey-btn { color: var(--fg-color); font-weight: bold; }
        .hotkey-scope { color: var(--accent-green); font-weight: bold; }
        .hotkey-scope.global { color: var(--accent-purple); }

        /* Interactive Wizards, Editors & Overlays */
        .tui-overlay {
            position: fixed;
            inset: 0;
            background: rgba(12, 12, 12, 0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        .tui-modal {
            width: 90%;
            max-width: 850px;
            height: 75vh;
            border: 1px solid var(--accent-blue);
            background: var(--bg-color);
            display: flex;
            flex-direction: column;
            padding: 16px;
            box-shadow: 0 0 20px rgba(0,0,0,1);
        }
        .tui-modal-title {
            color: var(--accent-blue);
            font-weight: bold;
            margin-bottom: 16px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
        }

        /* Form Controls for Editor */
        .tui-input, .tui-textarea {
            background-color: #1a1a1a;
            border: 1px solid var(--border-color);
            color: var(--fg-color);
            font-family: var(--font-mono);
            font-size: 13px;
            padding: 6px 10px;
            width: 100%;
            outline: none;
        }
        .tui-input:focus, .tui-textarea:focus {
            border-color: var(--accent-blue);
        }
        .tui-textarea {
            resize: none;
            height: 240px;
        }

        /* Interactive list blocks in Editor */
        .editor-option {
            padding: 8px;
            border: 1px solid var(--border-color);
            margin-bottom: 8px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .editor-option:hover, .editor-option.active {
            border-color: var(--accent-blue);
            background-color: rgba(96, 165, 250, 0.05);
        }

        /* Terminal styling elements */
        .cursor::after {
            content: '█';
            animation: blink 1s step-end infinite;
            margin-left: 2px;
        }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
        .text-green { color: var(--accent-green); }
        .text-blue { color: var(--accent-blue); }
        .text-yellow { color: var(--accent-yellow); }
    </style>
</head>

        ],
        profiles: [
            { id: 'bazel-build-optimization', provider: 'OpenCode', scope: 'Workspace', desc: "---\ntokens: 142\n---\nOptimize Bazel builds for large-scale enterprise monorepos.\nAutomatically handles configurations, remote execution pipelines, and local performance analysis.", skills: ['bazel-graph', 'logs', 'java-code-review'], mcps: ['github-mcp', 'aws-mcp'] },
            { id: 'api-contract-review', provider: 'ClaudeCode', scope: 'Workspace', desc: "---\ntokens: 98\n---\nAnalyzes API schemas and backend controller code to guarantee interface specifications conform to architecture conventions.", skills: ['java-code-review'], mcps: [] },
            { id: 'changelog-generator', provider: 'OpenCode', scope: 'Global', desc: "---\ntokens: 110\n---\nReads recent Git history and generates clean, semantic releases markdown logs with categorized improvements.", skills: ['git-commit'], mcps: ['github-mcp'] },
            { id: 'systematic-debugging', provider: 'OpenCode', scope: 'Global', desc: "---\ntokens: 135\n---\nDeep-dives into complex race-conditions, asynchronous failures, and segments errors using system logs.", skills: ['gdb-tools', 'logs'], mcps: [] },
        ],
        availableSkills: ['bazel-graph', 'logs', 'java-code-review', 'git-commit', 'gdb-tools'],
        availableMCPs: ['github-mcp', 'postgres-mcp', 'aws-mcp']
    };

    let state = {
        view: 'MAIN', // 'MAIN' | 'WIZARD' | 'LAUNCH' | 'EDITOR'
        activeTab: 5, // Tab 5 is profiles
        activeScope: 'WORKSPACE',
        selectedIndex: 0,
        searchQuery: '',

        wizard: { step: 0, name: '', scope: 'Workspace', qa: [{ q: "What is the primary task this agent should handle?", a: "" }, { q: "What tone or style should the agent use?", a: "" }], currQ: 0, tmpAns: "", skills: new Set(), mcps: new Set(), listIdx: 0 },

        editor: {
            profileIndex: 0,
            subView: 'MENU', // 'MENU' | 'EDIT_SKILLS' | 'EDIT_MCPS' | 'EDIT_FILE'
            tempSkills: new Set(),
            tempMcps: new Set(),
            tempDesc: '',
            listIdx: 0
        },

        launchLogs: []
    };

    /* Real-time estimation of tokens for user-edited agent prompts or skill descriptions */
    function estimateTokens(text) {
        // Look for YAML frontmatter block explicitly
        const match = text.match(/^---\s*\ntokens:\s*(\d+)\s*\n---/i);
        if (match) {
            return parseInt(match[1]);
        }
        // Fallback: estimate word-count tokens
        const cleanText = text.replace(/^---[\s\S]*?---/g, '').trim();
        if (!cleanText) return 0;
        return Math.round(cleanText.split(/\s+/).length * 1.35);
    }

    function getFilteredItems() {
        if (state.activeTab === 5) {
            if (!state.searchQuery) return DUMMY_DATA.profiles;
            return DUMMY_DATA.profiles.filter(p =>
                p.id.toLowerCase().includes(state.searchQuery.toLowerCase())
            );
        } else if (state.activeTab === 1) {
            if (!state.searchQuery) return DUMMY_DATA.skills;
            return DUMMY_DATA.skills.filter(s =>
                s.id.toLowerCase().includes(state.searchQuery.toLowerCase())
            );
        }
        return [];
    }

    /* --- Keyboard Input Loop --- */
    window.addEventListener('keydown', (e) => {
        if (['0', '1', '2', '3', '4', '5'].includes(e.key) && state.view === 'MAIN') {
            e.preventDefault();
            state.activeTab = parseInt(e.key);
            state.selectedIndex = 0;
            state.searchQuery = '';
            render();
            return;
        }

        const filtered = getFilteredItems();

        if (state.view === 'MAIN') {
            if (e.key === 'ArrowDown') {
                e.preventDefault();
                state.selectedIndex = Math.min(state.selectedIndex + 1, filtered.length - 1);
                render();
            }
            else if (e.key === 'ArrowUp') {
                e.preventDefault();
                state.selectedIndex = Math.max(state.selectedIndex - 1, 0);
                render();
            }
            else if (e.key === 'Tab') {
                e.preventDefault();
                state.activeScope = state.activeScope === 'WORKSPACE' ? 'GLOBAL' : 'WORKSPACE';
                render();
            }
            else if (e.key === ' ') {
                if (state.activeTab === 1 && filtered.length > 0) {
                    e.preventDefault();
                    filtered[state.selectedIndex].active = !filtered[state.selectedIndex].active;
                    render();
                }
            }
            else if (e.key === 'F2') {
                e.preventDefault();
                if (state.activeTab === 5) startWizard();
            }
            else if (e.key === 'F3') {
                e.preventDefault();
                if (state.activeTab === 5 && filtered.length > 0) {
                    const selectedProfile = filtered[state.selectedIndex];
                    const originalIndex = DUMMY_DATA.profiles.findIndex(p => p.id === selectedProfile.id);
                    startEditor(originalIndex);
                }
            }
            else if (e.key === 'Enter') {
                e.preventDefault();
                if (state.activeTab === 5 && filtered.length > 0) {
                    startLaunch(filtered[state.selectedIndex]);
                }
            }
            else if (e.key === 'Backspace') {
                if (state.searchQuery.length > 0) {
                    e.preventDefault();
                    state.searchQuery = state.searchQuery.slice(0, -1);
                    state.selectedIndex = 0;
                    render();
                }
            }
            else if (e.key === 'Escape') {
                if (state.searchQuery.length > 0) {
                    e.preventDefault();
                    state.searchQuery = '';
                    state.selectedIndex = 0;
                    render();
                }
            }
            else if (e.key.length === 1 && !e.ctrlKey && !e.altKey && !e.metaKey && /^[a-zA-Z0-9-_ ]$/.test(e.key)) {
                e.preventDefault();
                state.searchQuery += e.key;
                state.selectedIndex = 0;
                render();
            }
            else if (['F4', 'F5', 'F9'].includes(e.key) || (e.ctrlKey && ['o', 't'].includes(e.key.toLowerCase()))) {
                e.preventDefault();
            }
        } else if (state.view === 'WIZARD') {
            handleWizardKey(e);
        } else if (state.view === 'EDITOR') {
            handleEditorKey(e);
        } else if (state.view === 'LAUNCH') {
            if (e.key === 'Escape' || e.key === 'Enter') {
                state.view = 'MAIN';
                render();
            }
        }
    });

    /* --- Wizard --- */
    function startWizard() {
        state.view = 'WIZARD';
        state.wizard = { step: 0, name: '', scope: 'Workspace', qa: [{ q: "What is the primary task?", a: "" }, { q: "Any specific conventions?", a: "" }], currQ: 0, tmpAns: "", skills: new Set(), mcps: new Set(), listIdx: 0 };
        render();
    }

    function handleWizardKey(e) {
        let w = state.wizard;
        if (e.key === 'Escape') { state.view = 'MAIN'; render(); return; }

        if (w.step === 0) {
            if (e.key === 'Tab') { e.preventDefault(); w.scope = w.scope === 'Workspace' ? 'Global' : 'Workspace'; render(); }
            else if (e.key === 'Enter' && w.name) { w.step = 1; render(); }
            else if (e.key === 'Backspace') { w.name = w.name.slice(0, -1); render(); }
            else if (e.key.length === 1 && /^[a-zA-Z0-9-]$/.test(e.key)) { w.name += e.key; render(); }
        } else if (w.step === 1) {
            if (e.key === 'Enter') {
                w.qa[w.currQ].a = w.tmpAns;
                if (w.currQ < w.qa.length - 1) { w.currQ++; w.tmpAns = ""; } else { w.step = 2; w.listIdx = 0; }
                render();
            }
            else if (e.key === 'Backspace') { w.tmpAns = w.tmpAns.slice(0, -1); render(); }
            else if (e.key.length === 1) { w.tmpAns += e.key; render(); }
        } else if (w.step === 2 || w.step === 3) {
            let list = w.step === 2 ? DUMMY_DATA.availableSkills : DUMMY_DATA.availableMCPs;
            let set = w.step === 2 ? w.skills : w.mcps;
            if (e.key === 'ArrowDown') { w.listIdx = Math.min(w.listIdx + 1, list.length - 1); render(); }
            else if (e.key === 'ArrowUp') { w.listIdx = Math.max(w.listIdx - 1, 0); render(); }
            else if (e.key === ' ') { let item = list[w.listIdx]; set.has(item) ? set.delete(item) : set.add(item); render(); }
            else if (e.key === 'Enter') { w.step++; w.listIdx = 0; render(); }
        } else if (w.step === 4) {
            if (e.key === 'Enter') {
                const autoPrompt = w.qa.map(q=>`* ${q.q}\n  ${q.a}`).join('\n');
                DUMMY_DATA.profiles.push({
                    id: w.name,
                    provider: 'OpenCode',
                    scope: w.scope,
                    desc: `---\ntokens: ${estimateTokens(autoPrompt)}\n---\n` + autoPrompt,
                    skills: Array.from(w.skills),
                    mcps: Array.from(w.mcps)
                });
                state.view = 'MAIN';
                state.searchQuery = '';
                state.selectedIndex = DUMMY_DATA.profiles.length - 1;
                render();
            }
        }
    }

    /* --- Editor (F3 Configuration Modifications) --- */
    function startEditor(index) {
        const p = DUMMY_DATA.profiles[index];
        state.view = 'EDITOR';
        state.editor = {
            profileIndex: index,
            subView: 'MENU',
            tempSkills: new Set(p.skills),
            tempMcps: new Set(p.mcps),
            tempDesc: p.desc,
            listIdx: 0
        };
        render();
    }

    function handleEditorKey(e) {
        let ed = state.editor;

        if (e.key === 'Escape') {
            e.preventDefault();
            if (ed.subView === 'MENU') {
                state.view = 'MAIN';
            } else {
                ed.subView = 'MENU';
                ed.listIdx = 0;
            }
            render();
            return;
        }

        if (ed.subView === 'MENU') {
            if (e.key === 'ArrowDown') {
                e.preventDefault();
                ed.listIdx = Math.min(ed.listIdx + 1, 3);
                render();
            } else if (e.key === 'ArrowUp') {
                e.preventDefault();
                ed.listIdx = Math.max(ed.listIdx - 1, 0);
                render();
            } else if (e.key === 'Enter') {
                e.preventDefault();
                if (ed.listIdx === 0) {
                    ed.subView = 'EDIT_SKILLS';
                    ed.listIdx = 0;
                } else if (ed.listIdx === 1) {
                    ed.subView = 'EDIT_MCPS';
                    ed.listIdx = 0;
                } else if (ed.listIdx === 2) {
                    ed.subView = 'EDIT_FILE';
                    setTimeout(() => document.getElementById('raw-prompt-editor')?.focus(), 50);
                } else if (ed.listIdx === 3) {
                    saveProfileModifications();
                }
                render();
            }
        }
        else if (ed.subView === 'EDIT_SKILLS' || ed.subView === 'EDIT_MCPS') {
            let list = ed.subView === 'EDIT_SKILLS' ? DUMMY_DATA.availableSkills : DUMMY_DATA.availableMCPs;
            let set = ed.subView === 'EDIT_SKILLS' ? ed.tempSkills : ed.tempMcps;

            if (e.key === 'ArrowDown') {
                e.preventDefault();
                ed.listIdx = Math.min(ed.listIdx + 1, list.length - 1);
                render();
            } else if (e.key === 'ArrowUp') {
                e.preventDefault();
                ed.listIdx = Math.max(ed.listIdx - 1, 0);
                render();
            } else if (e.key === ' ') {
                e.preventDefault();
                let item = list[ed.listIdx];
                if (set.has(item)) set.delete(item);
                else set.add(item);
                render();
            } else if (e.key === 'Enter') {
                e.preventDefault();
                ed.subView = 'MENU';
                ed.listIdx = ed.subView === 'EDIT_SKILLS' ? 0 : 1;
                render();
            }
        }
        else if (ed.subView === 'EDIT_FILE') {
            if (e.key === 'Tab') {
                e.preventDefault();
                const rawVal = document.getElementById('raw-prompt-editor').value;
                const lines = rawVal.split('\n');

                // Keep frontmatter updated with estimated tokens if edited
                let updatedVal = rawVal;
                const count = estimateTokens(rawVal);
                if (rawVal.startsWith('---')) {
                    // Replace existing frontmatter token count
                    updatedVal = rawVal.replace(/^(tokens:\s*)\d+/m, `$1${count}`);
                } else {
                    // Prepend fresh frontmatter
                    updatedVal = `---\ntokens: ${count}\n---\n` + rawVal;
                }

                ed.tempDesc = updatedVal;
                ed.subView = 'MENU';
                ed.listIdx = 2;
                render();
            }
        }
    }

    function saveProfileModifications() {
        let ed = state.editor;
        let p = DUMMY_DATA.profiles[ed.profileIndex];
        p.skills = Array.from(ed.tempSkills);
        p.mcps = Array.from(ed.tempMcps);
        p.desc = ed.tempDesc;

        state.view = 'MAIN';
        render();
    }

    function saveRawFileChange(value) {
        state.editor.tempDesc = value;
    }

    /* --- Clean Launch Session Simulation --- */
    function startLaunch(profile) {
        if(!profile) return;
        state.view = 'LAUNCH'; state.launchLogs = []; render();
        const logs = [
            `[agk] Launching session for profile: ${profile.id}`,
            `[agk] Compiling temporary agent context payload...`,
            `[agk] Injecting ${profile.skills.length} skills & ${profile.mcps.length} MCPs into session metadata...`,
            `[opencode] Agent runtime initialized. (Simulating active terminal session...)`,
            `[opencode] Active configuration in-use: provider -> ${profile.provider}`,
            `[opencode] Current context description:`,
            `           "${profile.desc.replace(/\n/g, '\n           ')}"`,
            `[opencode] Session terminated.`,
            `[agk] Restoring workspace config parameters...`,
            `[agk] Session clean up complete. Workspace is pristine.`
        ];
        logs.forEach((msg, i) => {
            setTimeout(() => { state.launchLogs.push(msg); render(); }, i * 400);
        });
    }

    /* --- HTML Renderers --- */
    function render() {
        const app = document.getElementById('app');
        if (state.view === 'MAIN') {
            app.innerHTML = renderTopbar() + renderHeader() + renderMain() + renderFooter();
        } else if (state.view === 'WIZARD') {
            app.innerHTML = renderTopbar() + renderHeader() + renderMain() + renderFooter() + renderWizard();
        } else if (state.view === 'EDITOR') {
            app.innerHTML = renderTopbar() + renderHeader() + renderMain() + renderFooter() + renderEditor();
        } else if (state.view === 'LAUNCH') {
            app.innerHTML = `<div class="tui-list" style="padding: 16px; font-size:13px; line-height:1.5;">${state.launchLogs.map(l => `<div>${l}</div>`).join('')}<div class="cursor text-green" style="margin-top:12px;">> </div></div>`;
        }
    }

    function renderTopbar() {
        return `<div class="tui-topbar">agk v0.2.6</div>`;
    }

            { id: 5, label: '[5] Profiles' }

        return `
            <div class="tui-header">
                <div class="tui-tab-group">
                    ${tabs.map(t => `
                        <span class="tui-tab ${state.activeTab === t.id ? 'active' : ''}" onclick="state.activeTab = ${t.id}; state.selectedIndex=0; state.searchQuery=''; render();">
                            ${t.label}
                        </span>

                </div>
                <span class="tui-tab ${state.activeTab === 0 ? 'active' : ''}" onclick="state.activeTab = 0; state.selectedIndex=0; state.searchQuery=''; render();">
                    [0] Vaults
                </span>
            </div>
        `;
    }

                                </span>
                            </div>

        }

        if (state.activeTab === 5) {
            return `
                <div class="tui-main">
                    <!-- Left Column Panel: Profiles Selection -->
                    <div class="tui-panel left-pane">
                        <div class="tui-panel-title">Profiles</div>
                        <div class="tui-list">
                            ${filtered.map((p, i) => `
                                <div class="tui-list-item ${i === state.selectedIndex ? 'selected' : ''}">

                                    </div>

                            `).join('')}

                                <div style="color: var(--fg-muted); padding: 12px; font-style: italic;">No profiles found. Press F2 to add.</div>
                            ` : ''}

                            <div class="search-row">
                                <span class="search-label">Search:</span>
                                <span class="${state.searchQuery ? 'text-green font-bold' : 'dim'}" style="flex: 1;">
                                    ${state.searchQuery ? `${state.searchQuery}<span class="cursor"></span>` : '<span style="color: var(--fg-muted);">[type any key to search]</span>'}
                                </span>
                                ${state.searchQuery ? '<span style="color: var(--fg-muted); font-size:11px;">[Esc] Clear</span>' : ''}
                            </div>
                        </div>
                    </div>

                    <!-- Right Column Panel: Dynamic Overview Details -->
                    <div class="tui-panel right-pane">
                        <div class="tui-panel-title">Profile Inspection</div>
                        <div class="tui-list" style="padding: 0 4px;">
                            ${renderDetail(filtered)}

                    </div>
                </div>
            `;
        }

        return `
            <div class="tui-main" style="align-items: center; justify-content: center; color: var(--fg-muted);">
                <div style="text-align: center;">
                    <div style="font-size: 24px; margin-bottom: 8px;">Tab [${state.activeTab}] Mock Space</div>
                    <div>Press <span class="text-blue">[1]</span> or <span class="text-blue">[5]</span> key to jump to simulated panels.</div>

    function renderSkillDetail(filtered) {
        if (!filtered.length || state.selectedIndex >= filtered.length) {
            return '<div style="color: var(--fg-muted); padding: 12px;">No active skill matches query.</div>';
        }
        const s = filtered[state.selectedIndex];
        // Populate static detail defaults for rendering consistency with screenshot
        const kind = s.kind || 'Skill';
        const vault = s.vault_detail || 'ECC (github)';
        const path = s.path || `/Users/dkthezero/.config/agk/vaults/${s.vault}/skills/${s.id}`;
        const desc = s.desc || 'Optimized developer assistant utility template configuration setup.';
        const tokens = estimateTokens(desc);

        return `
            <div class="profile-title">
                <span>${s.id}</span>
                <span style="color: var(--accent-green); font-size:12px; font-weight: normal;">[Tokens: ${tokens}]</span>
            </div>

            <div class="detail-row"><div class="detail-label">Kind:</div><div class="detail-value text-yellow">${kind}</div></div>

            <br/>

            <br/>
            <div class="detail-row"><div class="detail-label">Identity:</div><div class="detail-value dim" style="color: var(--fg-muted);">${s.id}:64cd1ba248</div></div>
        `;
    }

    function renderDetail(filtered) {
        if (!filtered.length || state.selectedIndex >= filtered.length) {
            return '<div style="color: var(--fg-muted); padding: 12px;">No active profile matches query.</div>';
        }
        const p = filtered[state.selectedIndex];
        const scopeColor = p.scope === 'Global' ? 'text-purple' : 'text-green';

        // Frontmatter Parsing: extract raw text & tokens count safely
        const tokens = estimateTokens(p.desc);
        const cleanDesc = p.desc.replace(/^---[\s\S]*?---/g, '').trim();

        return `
            <div class="profile-title">
                <span>${p.id}</span>
                <span style="color: var(--accent-green); font-size:12px; font-weight: normal;">[Tokens: ${tokens}]</span>
            </div>

            <div class="detail-row">
                <div class="detail-label">Provider:</div>
                <div class="detail-value text-blue font-bold">${p.provider}</div>
            </div>

            </div>

            <div class="detail-row" style="margin-top: 10px;">

                <div class="detail-value text-yellow font-bold">${p.skills && p.skills.length ? p.skills.join(', ') : 'None attached'}</div>

    function renderWizard() {

            ${w.qa.slice(0, w.currQ).map(q => `<div class="dim">Q: ${q.q}<br/>A: <span class="text-green">${q.a}</span></div><br/>`).join('')}

                    <span class="text-green">Save</span>

            `;
        }
        else if (ed.subView === 'EDIT_SKILLS' || ed.subView === 'EDIT_MCPS') {
            let list = ed.subView === 'EDIT_SKILLS' ? DUMMY_DATA.availableSkills : DUMMY_DATA.availableMCPs;

            content = `
                <div style="margin-bottom:12px;" class="dim">

                </div>
                <div style="flex: 1; overflow-y: auto; border: 1px solid var(--border-color); padding: 4px;">
                    ${list.map((item, i) => `
                        <div class="tui-list-item ${i === ed.listIdx ? 'selected' : ''}" style="padding: 6px; cursor: pointer;"
                             onclick="let s = state.editor.${ed.subView === 'EDIT_SKILLS' ? 'tempSkills' : 'tempMcps'}; s.has('${item}') ? s.delete('${item}') : s.add('${item}'); render();">
                            <span>[${set.has(item) ? '✓' : ' '}] &nbsp; ${item}</span>
                        </div>
                    `).join('')}
                </div>
            `;
        }
        else if (ed.subView === 'EDIT_FILE') {
            const rawTokens = estimateTokens(ed.tempDesc);
            content = `
                <div style="margin-bottom:12px; display: flex; justify-content: space-between;" class="dim">
                    <span>Directly modify the Markdown context. <span class="text-yellow">[Tab]</span> to accept.</span>
                    <span style="color: var(--accent-green); font-weight: bold;">Estimated Prompt Tokens: ${rawTokens}</span>

                <textarea id="raw-prompt-editor" class="tui-textarea" oninput="saveRawFileChange(this.value);">${ed.tempDesc}</textarea>
            `;
        }

        return `
            <div class="tui-overlay">
                <div class="tui-modal">
                    <div class="tui-modal-title">Modify Profile Configurations: ${p.id}</div>
                    <div style="flex:1; display:flex; flex-direction:column; overflow-y:auto; padding-bottom:12px;">
                        ${content}
                    </div>
                    <div style="color: var(--fg-muted); border-top: 1px solid var(--border-color); padding-top: 8px; font-size: 12px; display:flex; justify-content:space-between;">
                        <span>[Esc] Abandon changes & Back</span>
                        ${ed.subView === 'MENU' ? '<span>[↑/↓] Navigate &nbsp; [Enter] Select</span>' : ''}
                        ${ed.subView === 'EDIT_FILE' ? '<span class="text-yellow">[Tab] Accept text edits</span>' : ''}
                    </div>
                </div>
            </div>
        `;
    }

    render();
</script>
